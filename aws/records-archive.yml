AWSTemplateFormatVersion: '2010-09-09'
Description: >
  WIC LLC promotional-material records archive. An S3 bucket with Object Lock
  (files read-only for the retention period) and a role that lets only the
  WICLLC/website GitHub workflow add files. No access keys are created.

  Deploy once: AWS console > CloudFormation (region US East (Ohio)) > Create
  stack > Upload this file. After testing, update the stack with
  RetentionMode = COMPLIANCE. That change cannot be undone.

Parameters:
  RetentionMode:
    Type: String
    Default: GOVERNANCE
    AllowedValues: [GOVERNANCE, COMPLIANCE]
    Description: >
      GOVERNANCE while testing (the root account can still remove files).
      COMPLIANCE for production (nobody can remove files until retention ends, not even root).
  RetentionYears:
    Type: Number
    Default: 5
    MinValue: 1
    Description: NFA/CFTC promotional material retention is 5 years.
  GitHubRepo:
    Type: String
    Default: WICLLC/website
  CreateGitHubOIDCProvider:
    Type: String
    Default: 'yes'
    AllowedValues: ['yes', 'no']
    Description: Choose 'no' only if this AWS account already has the token.actions.githubusercontent.com identity provider.

Conditions:
  MakeProvider: !Equals [!Ref CreateGitHubOIDCProvider, 'yes']

Resources:
  RecordsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'wicllc-records-${AWS::AccountId}'
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: !Ref RetentionMode
            Years: !Ref RetentionYears
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  RecordsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RecordsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt RecordsBucket.Arn
              - !Sub '${RecordsBucket.Arn}/*'
            Condition:
              Bool: {'aws:SecureTransport': 'false'}

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  ArchiveWriterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: wicllc-website-archive-writer
      Description: Assumed by the WICLLC/website workflow on main. Can add files to the records bucket; cannot delete or change retention.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOIDCProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubRepo}:ref:refs/heads/main'
      Policies:
        - PolicyName: add-records-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AddAndCheckFiles
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub '${RecordsBucket.Arn}/*'
              - Sid: ListBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt RecordsBucket.Arn
              - Sid: NeverRemoveOrUnlock
                Effect: Deny
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:PutObjectRetention
                  - s3:PutObjectLegalHold
                  - s3:BypassGovernanceRetention
                  - s3:PutBucketObjectLockConfiguration
                  - s3:PutBucketPolicy
                  - s3:PutLifecycleConfiguration
                Resource:
                  - !GetAtt RecordsBucket.Arn
                  - !Sub '${RecordsBucket.Arn}/*'

Outputs:
  BucketName:
    Description: GitHub repo variable AWS_ARCHIVE_BUCKET
    Value: !Ref RecordsBucket
  RoleArn:
    Description: GitHub repo variable AWS_ARCHIVE_ROLE_ARN
    Value: !GetAtt ArchiveWriterRole.Arn
