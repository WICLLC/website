AWSTemplateFormatVersion: '2010-09-09'
Description: >
  WIC Documentation Archive (WIC Social Media Usage, Approval, Publication and
  Archival Policy, Article 7). S3 bucket with Object Lock in compliance mode,
  5-year retention, website-snapshots/ prefix; a GitHub Actions upload role
  that cannot delete, overwrite retained objects or change Object Lock;
  success/failure/missed-run emails. Deploy in US East (Ohio).

Parameters:
  BucketName:
    Type: String
    Default: wic-documentation-archive
    AllowedPattern: '^[a-z0-9][a-z0-9-]{2,62}$'
    Description: S3 bucket names are global. If this one is taken, add a suffix (e.g. -0517172).
  RetentionYears:
    Type: Number
    Default: 5
    MinValue: 5
    Description: Policy Article 7.III.B minimum.
  ConfirmationEmail:
    Type: String
    Description: Policy Owner / Weekly Archive Reviewer (Randy Clodfelter). Receives success, failure and missed-run emails.
  PublisherEmail:
    Type: String
    Default: mitch.clod@wicllc.org
    Description: Designated Publisher. Receives the same emails.
  GitHubRepo:
    Type: String
    Default: WICLLC/website
  CreateGitHubOIDCProvider:
    Type: String
    Default: 'yes'
    AllowedValues: ['yes', 'no']
    Description: "'no' only if this account already has the token.actions.githubusercontent.com identity provider."

Conditions:
  MakeProvider: !Equals [!Ref CreateGitHubOIDCProvider, 'yes']

Resources:
  # ── Archive bucket (Article 7.III) ────────────────────────────────────────
  ArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: COMPLIANCE
            Years: !Ref RetentionYears
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      Tags:
        - {Key: Name, Value: WIC Documentation Archive}
        - {Key: Policy, Value: WIC Social Media Usage Approval Publication and Archival Policy}

  ArchiveBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArchiveBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt ArchiveBucket.Arn, !Sub '${ArchiveBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}

  # ── GitHub Actions upload credential (Article 7.IV) ───────────────────────
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  GitHubUploadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: wic-github-archive-uploader
      Description: WICLLC/website workflows on main only. Uploads archive objects; cannot delete, change retention or administer AWS.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOIDCProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                # main-branch runs, and the deploy job (runs in the github-pages
                # environment, which GitHub limits to main)
                'token.actions.githubusercontent.com:sub':
                  - 'repo:WICLLC@345945080/website@1428690964:ref:refs/heads/main'
                  - 'repo:WICLLC@345945080/website@1428690964:environment:github-pages'
      Policies:
        - PolicyName: upload-archive-objects-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Upload
                Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub '${ArchiveBucket.Arn}/website-snapshots/*'
                  - !Sub '${ArchiveBucket.Arn}/workflow-runs/*'
              - Sid: NeverDeleteOrUnlock
                Effect: Deny
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:PutObjectRetention
                  - s3:PutObjectLegalHold
                  - s3:BypassGovernanceRetention
                  - s3:PutBucketObjectLockConfiguration
                  - s3:PutBucketVersioning
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutLifecycleConfiguration
                  - s3:DeleteBucket
                Resource: [!GetAtt ArchiveBucket.Arn, !Sub '${ArchiveBucket.Arn}/*']

  # ── Confirmations and alerts (Articles 9.I.F, 10.IV) ──────────────────────
  NotifyTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: wic-archive-notifications
      DisplayName: WIC Archive
      Subscription:
        - {Protocol: email, Endpoint: !Ref ConfirmationEmail}
        - {Protocol: email, Endpoint: !Ref PublisherEmail}

  NotifierRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: read-run-records-and-notify
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: s3:GetObject, Resource: !Sub '${ArchiveBucket.Arn}/workflow-runs/*'}
              - {Effect: Allow, Action: s3:ListBucket, Resource: !GetAtt ArchiveBucket.Arn}
              - {Effect: Allow, Action: sns:Publish, Resource: !Ref NotifyTopic}

  # Emails each run record the workflows write to workflow-runs/, and each
  # weekday evening checks that a website snapshot succeeded that day.
  Notifier:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: wic-archive-notifier
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt NotifierRole.Arn
      Environment:
        Variables:
          BUCKET: !Ref ArchiveBucket
          TOPIC: !Ref NotifyTopic
      Code:
        ZipFile: |
          import json, os
          from datetime import datetime, timedelta, timezone
          import boto3
          s3, sns = boto3.client('s3'), boto3.client('sns')
          B, T = os.environ['BUCKET'], os.environ['TOPIC']

          def send(subject, body):
              sns.publish(TopicArn=T, Subject=subject[:99], Message=body)

          def handler(event, context):
              if event.get('detail-type') == 'Object Created':
                  key = event['detail']['object']['key']
                  rec = json.loads(s3.get_object(Bucket=B, Key=key)['Body'].read())
                  body = rec.get('summary', '') + f"\n\nRun: {rec.get('run_url', '')}\nRecord: s3://{B}/{key}\n"
                  send(rec.get('subject', 'WIC Archive: ' + key), body)
                  return
              # Weekday missed-run check (Article 10.IV): runs 9 PM CDT / 8 PM CST,
              # so the last 24 hours are that Central business day. Run records
              # are workflow-runs/website-snapshot/<YYYY-MM-DDTHHMMSSZ>_<status>.json.
              now = datetime.now(timezone.utc)
              since = (now - timedelta(hours=24)).strftime('%Y-%m-%dT%H%M%SZ')
              keys = []
              for day in sorted({since[:10], now.strftime('%Y-%m-%d')}):
                  prefix = f'workflow-runs/website-snapshot/{day}'
                  keys += [o['Key'] for o in s3.list_objects_v2(Bucket=B, Prefix=prefix).get('Contents', [])]
              keys = [k for k in keys if k.rsplit('/', 1)[1] >= since]
              if not any(k.endswith('_SUCCESS.json') for k in keys):
                  send('WIC Archive ALERT: no website snapshot today',
                       f'No successful website snapshot was recorded in the 24 hours to '
                       f'{now:%Y-%m-%d %H:%M} UTC.\n'
                       f'Snapshot runs found: {len(keys)}.\n\n'
                       'Treat as a Failure Event (Policy Article 12): check GitHub Actions '
                       '"Update market data" and "Deploy site" in WICLLC/website, re-run the '
                       'deploy, and verify the snapshot in website-snapshots/.')

  RunRecordRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Email each workflow run record (success or failure).
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket: {name: [!Ref ArchiveBucket]}
          object: {key: [{prefix: workflow-runs/}]}
      Targets:
        - {Id: notifier, Arn: !GetAtt Notifier.Arn}

  DailyCheckRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Weekday missed-run check for the website snapshot (Mon-Fri 9 PM CDT / 8 PM CST).
      # 02:00 UTC Tue-Sat. The last market data run is 23:05 UTC and GitHub has
      # started it as late as ~00:35 UTC; deploy plus snapshot takes ~10 min.
      ScheduleExpression: cron(0 2 ? * TUE-SAT *)
      State: ENABLED
      Targets:
        - {Id: notifier, Arn: !GetAtt Notifier.Arn}

  RunRecordPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Notifier
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RunRecordRule.Arn

  DailyCheckPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Notifier
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyCheckRule.Arn

Outputs:
  BucketName:
    Description: GitHub repo variable AWS_ARCHIVE_BUCKET
    Value: !Ref ArchiveBucket
  UploadRoleArn:
    Description: GitHub repo secret AWS_ARCHIVE_ROLE_ARN
    Value: !GetAtt GitHubUploadRole.Arn
