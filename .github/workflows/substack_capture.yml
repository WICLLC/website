# Daily Substack capture (Policy Article 9.II): reads the RSS feed and saves
# each new or changed post to substack-captures/ in the WIC Documentation
# Archive. Each run's result is written to workflow-runs/substack-capture/,
# which the archive emails as the daily confirmation; a missing confirmation
# triggers a missed-run alert from AWS (Article 10.IV).
#
# Inactive until the repo variable AWS_ARCHIVE_BUCKET is set.

name: Substack capture

on:
  schedule:
    # Daily 7:23 AM CDT / 6:23 AM CST (avoids the busy top of the hour)
    - cron: '23 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: substack-capture
  cancel-in-progress: false

jobs:
  capture:
    if: vars.AWS_ARCHIVE_BUCKET != ''
    runs-on: ubuntu-latest
    env:
      ARCHIVE_BUCKET: ${{ vars.AWS_ARCHIVE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 requests
      - name: Sign in to the WIC Documentation Archive
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARCHIVE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - name: Capture new or changed posts
        run: python scripts/substack_capture.py
      - name: Record failure in the archive
        if: failure()
        run: python scripts/archive_common.py substack-capture "The daily Substack capture failed."
